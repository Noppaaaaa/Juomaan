<!doctype html>
<html lang="fi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sivua ei löytynyt | Juomaan</title>
    <link rel="icon" href="/favicon.png" type="image/png" sizes="192x192">
    <style>
        :root { color-scheme: light dark; }
        body { max-width: 36rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.6 system-ui, sans-serif; }
        label { display: block; }
        input, button { box-sizing: border-box; max-width: 100%; padding: .4rem; font: inherit; }
    </style>
</head>
<body>
    <main>
        <h1>Sivua ei löytynyt</h1>
        <p>Osoite voi olla vanhentunut. Voit hakea juomaa tai avata vertailun suoraan.</p>
        <form action="/" method="get">
            <label for="haku">Hae tuotetta tai juomatyyppiä</label>
            <input id="haku" type="search" name="haku" maxlength="100" required>
            <button type="submit">Hae hintavertailusta</button>
        </form>
        <ul>
            <li><a href="/">Alkon ja markettien hintavertailu</a></li>
            <li><a href="/alkon-hinnasto/">Alkon hinnasto</a></li>
            <li><a href="/alkon-viinit/">Alkon viinien hinnat</a></li>
            <li><a href="/halvin-viina/">Viinojen ja vodkien hinnat</a></li>
            <li><a href="/alkoholiannos/">Alkoholiannoslaskuri</a></li>
        </ul>
    </main>
</body>
</html>
