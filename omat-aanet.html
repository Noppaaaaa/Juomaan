        body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;margin:0;padding:100px 20px 40px;background:var(--bg-body);color:var(--text-main);min-height:100vh;overflow-x:hidden;overscroll-behavior-x:none;transition:background .3s,color .3s}

        /* ===== Nav (vain napit, ei glass-taustaa) ===== */
        .paavalikko{position:fixed;top:0;left:0;right:0;z-index:99999;width:100vw;box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(0,0,0,.2)}

        .paavalikko .ylapalkki-napit .yp-nappi{flex:1;justify-content:center;text-align:center}
        @media(max-width:768px){.paavalikko .ylapalkki-napit{flex-basis:100%;gap:8px}.paavalikko .ylapalkki-napit .yp-nappi{white-space:normal;line-height:1.2}}
        @media(max-width:480px){.paavalikko .ylapalkki-napit .yp-nappi{font-size:12px;padding:12px 6px}}
        .yp-nappi{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:15px 16px;background:transparent;border-radius:9999px;text-decoration:none;color:var(--nav-btn-text);font-size:14px;font-weight:600;z-index:1;white-space:nowrap;transition:transform .2s;}
        .yp-nappi::before{content:'';position:absolute;z-index:-1;inset:0;border-radius:9999px;background-color:rgba(20,27,40,.30);border:2px solid var(--nav-btn-outline);-webkit-backdrop-filter:blur(6px) saturate(1.6);backdrop-filter:blur(6px) saturate(1.6)}
        @supports (backdrop-filter:url(#container-glass)) or (-webkit-backdrop-filter:url(#container-glass)){.yp-nappi::before{-webkit-backdrop-filter:url(#container-glass) saturate(1.6);backdrop-filter:url(#container-glass) saturate(1.6)}}
        .yp-nappi:hover{transform:scale(1.05)}
        .nav-active{position:absolute;top:0;left:0;height:100%;border-radius:9999px;background-color:var(--nav-active-bg);z-index:2;pointer-events:none;transition:transform .12s cubic-bezier(.22,1,.36,1),width .12s cubic-bezier(.22,1,.36,1)}.yp-nappi.aktiivinen{color:var(--nav-btn-text-active)}

        .switcher-rivi .switcher{margin:0 0 0 auto}
        /* Sisältö */
        .info{display:block;padding:12px 16px;background-color:var(--info-bg);color:var(--info-text);border-left:4px solid var(--info-border);border-radius:6px;font-weight:500;font-size:15px;margin:18px 0 24px}

        body.dark-mode .peru-nappi{border-color:#ff6b6b;color:#ff6b6b}

        /* ===== Teema-switcher (glass, 2 opt) ===== */
        .switcher{all:unset;display:flex;align-items:center;gap:4px;width:112px;height:32px;box-sizing:border-box;padding:3px 4px;margin:0 auto;border:none;border-radius:99em;background-color:color-mix(in srgb,var(--c-glass) 12%,transparent);-webkit-backdrop-filter:blur(8px) url(#switcher) saturate(var(--saturation));backdrop-filter:blur(8px) url(#switcher) saturate(var(--saturation));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c-light) calc(var(--glass-reflex-light)*10%),transparent),inset 1.8px 3px 0px -2px color-mix(in srgb,var(--c-light) calc(var(--glass-reflex-light)*90%),transparent),inset -2px -2px 0px -2px color-mix(in srgb,var(--c-light) calc(var(--glass-reflex-light)*80%),transparent),inset -3px -8px 1px -6px color-mix(in srgb,var(--c-light) calc(var(--glass-reflex-light)*60%),transparent),inset -0.3px -1px 4px 0px color-mix(in srgb,var(--c-dark) calc(var(--glass-reflex-dark)*12%),transparent),inset -1.5px 2.5px 0px -2px color-mix(in srgb,var(--c-dark) calc(var(--glass-reflex-dark)*20%),transparent),inset 0px 3px 4px -2px color-mix(in srgb,var(--c-dark) calc(var(--glass-reflex-dark)*20%),transparent),inset 2px -6.5px 1px -4px color-mix(in srgb,var(--c-dark) calc(var(--glass-reflex-dark)*10%),transparent),0px 1px 5px 0px color-mix(in srgb,var(--c-dark) calc(var(--glass-reflex-dark)*10%),transparent),0px 6px 16px 0px color-mix(in srgb,var(--c-dark) calc(var(--glass-reflex-dark)*8%),transparent);transition:background-color 400ms cubic-bezier(1,0,0.4,1),box-shadow 400ms cubic-bezier(1,0,0.4,1);position:relative}
        .switcher__legend{position:absolute;width:1px;height:1px;margin:-1px;border:0;padding:0;white-space:nowrap;clip-path:inset(100%);clip:rect(0 0 0 0);overflow:hidden}
        .switcher__input{clip:rect(0 0 0 0);clip-path:inset(100%);height:1px;width:1px;overflow:hidden;position:absolute;white-space:nowrap}
        .switcher__icon{display:block;width:22px;height:22px;transition:scale 200ms cubic-bezier(0.5,0,0,1)}
        .switcher__filter{position:absolute;width:0;height:0;z-index:-1}
        .switcher__option{--c:var(--nav-btn-text);display:flex;justify-content:center;align-items:center;padding:0 2px;width:48px;height:100%;box-sizing:border-box;border-radius:99em;opacity:1;transition:all 160ms}
        .switcher__option:hover{--c:var(--link-color);cursor:pointer}
        .switcher__option:hover .switcher__icon{scale:1.2}
        .switcher__option:has(input:checked){--c:var(--nav-btn-text);cursor:auto}
        .switcher__option:has(input:checked) .switcher__icon{scale:1}
        .switcher::after{content:'';position:absolute;left:2px;top:3px;display:block;width:52px;height:calc(100% - 8px);border-radius:99em;background-color:color-mix(in srgb,var(--c-glass) 36%,transparent);z-index:-1;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c-light) calc(var(--glass-reflex-light)*10%),transparent),inset 2px 1px 0px -1px color-mix(in srgb,var(--c-light) calc(var(--glass-reflex-light)*90%),transparent),inset -1.5px -1px 0px -1px color-mix(in srgb,var(--c-light) calc(var(--glass-reflex-light)*80%),transparent),inset -2px -6px 1px -5px color-mix(in srgb,var(--c-light) calc(var(--glass-reflex-light)*60%),transparent),inset -1px 2px 3px -1px color-mix(in srgb,var(--c-dark) calc(var(--glass-reflex-dark)*20%),transparent),inset 0px -4px 1px -2px color-mix(in srgb,var(--c-dark) calc(var(--glass-reflex-dark)*10%),transparent),0px 3px 6px 0px color-mix(in srgb,var(--c-dark) calc(var(--glass-reflex-dark)*8%),transparent)}
        .switcher:has(input[c-option="1"]:checked)::after{translate:0 0;transform-origin:right;transition:background-color 400ms cubic-bezier(1,0,0.4,1),box-shadow 400ms cubic-bezier(1,0,0.4,1),translate 400ms cubic-bezier(1,0,0.4,1);animation:scaleToggle 440ms ease}
        .switcher[c-previous="1"]:has(input[c-option="2"]:checked)::after{transform-origin:left}
        .switcher:has(input[c-option="2"]:checked)::after{translate:48px 0;transition:background-color 400ms cubic-bezier(1,0,0.4,1),box-shadow 400ms cubic-bezier(1,0,0.4,1),translate 400ms cubic-bezier(1,0,0.4,1);animation:scaleToggle2 440ms ease}
        @keyframes scaleToggle{0%{scale:1 1}50%{scale:1.1 1}100%{scale:1 1}}
        @keyframes scaleToggle2{0%{scale:1 1}50%{scale:1.2 1}100%{scale:1 1}}

    <script>
    (function(){"use strict";
        /* ---- Teema (glass switcher) ---- */
        const switcher=document.querySelector('[data-switcher]'),metaThemeColor=document.getElementById("metaThemeColor"),teemaInputs=switcher.querySelectorAll('.switcher__input'),tallennettuTeema=localStorage.getItem("teema");
        function asetaTeema(arvo){document.body.classList.toggle("dark-mode",arvo==="dark");switcher.dataset.value=arvo;teemaInputs.forEach(function(inp){inp.checked=inp.value===arvo});localStorage.setItem("teema",arvo);metaThemeColor?.setAttribute("content",arvo==="dark"?"#1a1e26":"#8B0000")}
        if(tallennettuTeema==="light"||tallennettuTeema==="dark")asetaTeema(tallennettuTeema);else asetaTeema("light");
        teemaInputs.forEach(function(inp){inp.addEventListener("change",function(){if(this.checked)asetaTeema(this.value)})});

        /* ---- Äänet ---- */
        const AANI_API="";
        const AANI_URL=(AANI_API?AANI_API.replace(/\/$/,''):'')+'/api/votes';
        const infoDiv=document.getElementById('info'),lista=document.getElementById('lista');
        const clientId=localStorage.getItem('aaniClientId')||'';
        let AANI_MAX=3,tuoteKartta={};

        function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m])}
        function tuoteAvain(t){return (t.nimi||'').trim()+'||'+t.alkoholi_prosentti+'||'+t.hinta_eur}

        function naytaTyhja(){lista.innerHTML='';infoDiv.style.display='none';lista.innerHTML='<div class="tyhja">Et ole vielä antanut yhtään ääntä.<br>Siirry <a href="index.html">etusivulle</a> ja äänestä juomia 👍</div>'}

        function renderoi(omat){
            if(!omat.length){naytaTyhja();return}
            infoDiv.innerHTML=`Olet antanut <strong>${omat.length}/${AANI_MAX}</strong> ääntä. Voit perua äänen alta.`;
            lista.innerHTML='';
            for(const avain of omat){
                const t=tuoteKartta[avain];
                const nimi=t?t.nimi:avain.split('||')[0];
                const url=t&&t.linkki&&t.linkki.trim()?t.linkki:`https://www.alko.fi/fi/tuotteet?q=${encodeURIComponent(nimi)}`;
                const kuva=t&&t.kuva_url?`<img src="${escapeHtml(t.kuva_url)}" alt="" onerror="this.style.display='none'">`:'';
                const meta=t?`${Number(t.alkoholi_prosentti).toFixed(1)} % · ${Number(t.hinta_eur).toFixed(2)} €`:'';
                const kortti=document.createElement('div');
                kortti.className='aani-kortti';
                kortti.dataset.avain=avain;
                kortti.innerHTML=`${kuva}<div class="tiedot"><p class="nimi"><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(nimi)}</a></p><div class="meta">${escapeHtml(meta)}</div></div><button type="button" class="peru-nappi">✕ Peru ääni</button>`;
                kortti.querySelector('.peru-nappi').addEventListener('click',function(){peruAani(avain,this,kortti)});
                lista.appendChild(kortti);
            }
        }

        async function peruAani(avain,btn,kortti){
            btn.disabled=true;btn.textContent='Perutaan…';
            try{
                const r=await fetch(AANI_URL,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId,key:avain})});
                if(!r.ok)throw new Error('HTTP '+r.status);
                const d=await r.json();
                renderoi(Array.isArray(d.omat)?d.omat:[]);
            }catch(e){
                btn.disabled=false;btn.textContent='✕ Peru ääni';
                infoDiv.style.display='block';infoDiv.innerHTML='⚠️ Äänen peruminen ei juuri nyt onnistunut. Yritä uudelleen.';
            }
        }

        async function lataa(){
            if(!clientId){naytaTyhja();return}
            try{
                const [vastaus,tuotteet]=await Promise.all([
                    fetch(`${AANI_URL}?clientId=${encodeURIComponent(clientId)}`).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}),
                    fetch('alko_tuotteet.json').then(r=>r.ok?r.json():[]).catch(()=>[])
                ]);
                if(typeof vastaus.max==='number')AANI_MAX=vastaus.max;
                if(Array.isArray(tuotteet)){for(const t of tuotteet){if(!t||!t.nimi)continue;const avain=tuoteAvain({nimi:t.nimi,alkoholi_prosentti:Number(t.alkoholi_prosentti)||0,hinta_eur:Number(t.hinta_eur)||0});if(!(avain in tuoteKartta))tuoteKartta[avain]={nimi:t.nimi.trim(),alkoholi_prosentti:Number(t.alkoholi_prosentti)||0,hinta_eur:Number(t.hinta_eur)||0,linkki:t.linkki||'',kuva_url:t.kuva_url||''}}}
                infoDiv.style.display='block';
                renderoi(Array.isArray(vastaus.omat)?vastaus.omat:[]);
            }catch(e){
                infoDiv.innerHTML='❌ Ääniä ei voitu ladata juuri nyt. <a href="index.html">Takaisin etusivulle</a>.';
            }
        }
        lataa();
    })();
    </script>

    <script>
    (function(){
      var napit=document.querySelector('.paavalikko .ylapalkki-napit');
      if(!napit)return;
      var btns=[].slice.call(napit.querySelectorAll('.yp-nappi'));
      if(!btns.length)return;
      var el=document.createElement('span');
      el.className='nav-active';
      napit.insertBefore(el,napit.firstChild);
      var activeIdx=btns.findIndex(function(b){return b.classList.contains('aktiivinen');});
      if(activeIdx<0)activeIdx=0;
      function place(idx,animate){
        var b=btns[idx];if(!b)return;
        el.style.transition=animate?'':'none';
        el.style.width=b.offsetWidth+'px';
        el.style.transform='translateX('+b.offsetLeft+'px)';
        if(!animate)void el.offsetWidth;
      }
      var prev=sessionStorage.getItem('navIdx');
      var prevIdx=(prev!==null)?parseInt(prev,10):activeIdx;
      if(isNaN(prevIdx)||prevIdx<0||prevIdx>=btns.length)prevIdx=activeIdx;
      place(prevIdx,false);
      requestAnimationFrame(function(){requestAnimationFrame(function(){place(activeIdx,true);});});
      try{sessionStorage.setItem('navIdx',activeIdx);}catch(e){}
      var rt;
      window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){place(activeIdx,false);},80);});
    })();
    </script>
